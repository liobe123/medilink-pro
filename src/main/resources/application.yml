server:
  port: 8080

spring:
  application:
    name: medilinkpro-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medilinkpro}
    username: ${DB_USERNAME:medilinkpro_user}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

medilinkpro:
  jwt:
    # Cle secrete encodee en Base64 (HS256). Doit etre fournie via la variable
    # d'environnement JWT_SECRET (aucune valeur par defaut : l'application refuse
    # de demarrer sans secret explicite). Generer par ex. avec :
    #   openssl rand -base64 64
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
